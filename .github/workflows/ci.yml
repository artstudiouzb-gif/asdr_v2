name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-sync:
    name: Synchronize notification schema
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/notification-center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/notification-center
          fetch-depth: 0
      - name: Add notification tables to fresh-install schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('database/schema.sql')
          schema = path.read_text(encoding='utf-8')
          migration_name = '2026_08_03_notification_center.sql'
          if migration_name in schema:
              print('Schema already synchronized.')
              raise SystemExit(0)

          ddl = '''

-- ---------------------------------------------------------------------------
-- Персональный Центр уведомлений администраторов и редакторов
-- ---------------------------------------------------------------------------
CREATE TABLE IF NOT EXISTS notifications (
    id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
    category VARCHAR(40) NOT NULL DEFAULT 'system',
    severity VARCHAR(16) NOT NULL DEFAULT 'info',
    title VARCHAR(190) NOT NULL,
    message TEXT NOT NULL,
    action_url VARCHAR(500) NULL,
    dedupe_key VARCHAR(190) NULL,
    requires_ack TINYINT(1) NOT NULL DEFAULT 0,
    created_by INT UNSIGNED NULL,
    expires_at DATETIME NULL,
    created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
    UNIQUE KEY uq_notifications_dedupe (dedupe_key),
    KEY idx_notifications_created (created_at),
    KEY idx_notifications_category_severity (category, severity),
    CONSTRAINT fk_notifications_created_by
        FOREIGN KEY (created_by) REFERENCES users(id) ON DELETE SET NULL
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

CREATE TABLE IF NOT EXISTS notification_recipients (
    id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
    notification_id BIGINT UNSIGNED NOT NULL,
    user_id INT UNSIGNED NOT NULL,
    read_at DATETIME NULL,
    acknowledged_at DATETIME NULL,
    dismissed_at DATETIME NULL,
    created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
    UNIQUE KEY uq_notification_recipient (notification_id, user_id),
    KEY idx_notification_recipient_unread (user_id, read_at, dismissed_at),
    KEY idx_notification_recipient_ack (user_id, acknowledged_at),
    CONSTRAINT fk_notification_recipients_notification
        FOREIGN KEY (notification_id) REFERENCES notifications(id) ON DELETE CASCADE,
    CONSTRAINT fk_notification_recipients_user
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

CREATE TABLE IF NOT EXISTS notification_preferences (
    user_id INT UNSIGNED PRIMARY KEY,
    email_enabled TINYINT(1) NOT NULL DEFAULT 0,
    telegram_enabled TINYINT(1) NOT NULL DEFAULT 0,
    minimum_severity VARCHAR(16) NOT NULL DEFAULT 'warning',
    quiet_start TIME NULL,
    quiet_end TIME NULL,
    digest_mode VARCHAR(16) NOT NULL DEFAULT 'none',
    updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
    CONSTRAINT fk_notification_preferences_user
        FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;

CREATE TABLE IF NOT EXISTS notification_deliveries (
    id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
    recipient_id BIGINT UNSIGNED NOT NULL,
    channel VARCHAR(16) NOT NULL,
    destination VARCHAR(255) NOT NULL,
    status VARCHAR(16) NOT NULL DEFAULT 'pending',
    attempts TINYINT UNSIGNED NOT NULL DEFAULT 0,
    next_attempt_at DATETIME NULL,
    locked_until DATETIME NULL,
    last_error TEXT NULL,
    sent_at DATETIME NULL,
    idempotency_key VARCHAR(190) NOT NULL,
    created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
    updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
    UNIQUE KEY uq_notification_delivery_idempotency (idempotency_key),
    KEY idx_notification_delivery_queue (status, next_attempt_at, locked_until, created_at),
    CONSTRAINT fk_notification_deliveries_recipient
        FOREIGN KEY (recipient_id) REFERENCES notification_recipients(id) ON DELETE CASCADE
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
'''

          marker = '-- ---------------------------------------------------------------------------\n-- Применённые миграции (для CLI database/migrate.php)'
          if marker not in schema:
              raise SystemExit('Migration marker was not found in schema.sql')
          schema = schema.replace(marker, ddl + '\n' + marker, 1)

          old_tail = "    ('2026_08_02_social_scheduled_at.sql')\nON DUPLICATE KEY UPDATE filename = filename;"
          new_tail = "    ('2026_08_02_social_scheduled_at.sql'),\n    ('2026_08_03_notification_center.sql')\nON DUPLICATE KEY UPDATE filename = filename;"
          if old_tail not in schema:
              raise SystemExit('Migration list tail was not found in schema.sql')
          schema = schema.replace(old_tail, new_tail, 1)
          path.write_text(schema, encoding='utf-8')
          PY

          rm -f .github/workflows/diagnose-notification-tests.yml notification-test-output.txt
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/schema.sql .github/workflows/diagnose-notification-tests.yml notification-test-output.txt || true
          git commit -m "Synchronize notification tables with fresh-install schema"
          git push origin HEAD:feature/notification-center

  test:
    name: Lint + Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: asdr_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, gd, curl, dom, fileinfo, openssl, zip
          coverage: none

      - name: Load schema
        run: php tests/load_schema.php asdr_test

      - name: PHP lint (php -l)
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l >/dev/null

      - name: Run test suite
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_DATABASE: asdr_test
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ''
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          php tests/run.php

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, curl, dom, fileinfo, openssl, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-lock

      - name: Install development tools
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --no-interaction

      - name: PHPStan (blocking)
        run: composer analyse

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install JavaScript tooling
        run: npm ci
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high
      - name: Scan tracked files for committed secrets
        run: npm run check:security
      - name: Verify generated asset bundles
        run: npm run check:assets
      - name: Reject new static inline styles
        run: npm run check:styles
      - name: Check JavaScript syntax
        run: find public/assets/js -not -path '*/vendor/*' -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  browser-smoke:
    name: Browser smoke (Chromium)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: asdr_browser
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, gd, curl, dom, fileinfo, openssl, zip
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Prepare test site
        env:
          APP_ENV: testing
          APP_DEBUG: 'true'
          APP_URL: http://127.0.0.1:8080
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: asdr_browser
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php tests/load_schema.php asdr_browser
          php -r "
            \$pdo = new PDO('mysql:host=127.0.0.1;port=3306;dbname=asdr_browser', 'root', '');
            \$pdo->exec(\"
              INSERT INTO pages (title, slug, status, is_home, layout_type)
              VALUES ('Главная', 'home', 'published', 1, 'no_sidebar')
              ON DUPLICATE KEY UPDATE title = VALUES(title), status = 'published';
              SET @home_id = (SELECT id FROM pages WHERE slug = 'home' ORDER BY id ASC LIMIT 1);
              UPDATE pages SET is_home = IF(id = @home_id, 1, 0);
              INSERT INTO page_translations (page_id, lang, title)
              VALUES (@home_id, 'uz', 'Bosh sahifa')
              ON DUPLICATE KEY UPDATE title = VALUES(title);
              INSERT INTO menu_items (lang, title, url_type, url_value, sort_order, is_active)
              SELECT '', 'Главная', 'page', 'home', 0, 1
              WHERE NOT EXISTS (
                SELECT 1 FROM menu_items WHERE url_type = 'page' AND url_value = 'home' AND is_active = 1
              );
            \");
          "
          cp config/config.example.php config/config.php
          mkdir -p storage/logs storage/cache storage/protected_uploads
          touch storage/installed.lock

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start application
        env:
          APP_ENV: testing
          APP_DEBUG: 'true'
          APP_URL: http://127.0.0.1:8080
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: asdr_browser
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          php -S 127.0.0.1:8080 -t public public/router.php > /tmp/asdr-server.log 2>&1 &
          echo $! > /tmp/asdr-server.pid
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/asdr-server.log
          exit 1

      - name: Run browser smoke tests
        run: npm run test:browser

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
            /tmp/asdr-server.log
          if-no-files-found: ignore
