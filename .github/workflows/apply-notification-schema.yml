name: Apply notification schema

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/notification-center'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Synchronize fresh-install schema
        run: python3 .github/scripts/apply-notification-schema.py

      - name: Validate migration consistency
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/cases/06_migrations_test.php
          php -l tests/cases/210_notification_center_test.php
          grep -q 'CREATE TABLE IF NOT EXISTS notifications' database/schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS notification_recipients' database/schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS notification_preferences' database/schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS notification_deliveries' database/schema.sql
          grep -q "('2026_08_03_notification_center.sql')" database/schema.sql
          test ! -e .github/workflows/diagnose-notification-tests.yml
          test ! -e notification-test-output.txt
          grep -q 'contents: read' .github/workflows/ci.yml
          ! grep -q 'schema-sync:' .github/workflows/ci.yml

      - name: Commit final schema
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-notification-schema.yml
          rm .github/scripts/apply-notification-schema.py
          rmdir .github/scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize notification tables with fresh-install schema"
          git push origin HEAD:${{ github.head_ref }}
