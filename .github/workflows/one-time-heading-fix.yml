name: One-time frontend heading fix

on:
  push:
    branches:
      - fix/frontend-heading-hierarchy

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-heading-hierarchy
          fetch-depth: 0

      - name: Apply exact semantic markup change
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/Views/site/news_show.php')
          text = path.read_text(encoding='utf-8')
          old = '<h2 class="newsdetail-share__title"><?= htmlspecialchars(t(\'Поделиться\'), ENT_QUOTES) ?></h2>'
          new = '<p class="newsdetail-share__title"><?= htmlspecialchars(t(\'Поделиться\'), ENT_QUOTES) ?></p>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one share heading, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit final change and remove one-time workflow
        run: |
          rm .github/workflows/one-time-heading-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Views/site/news_show.php .github/workflows/one-time-heading-fix.yml
          git commit -m "Correct share label heading semantics"
          git push origin HEAD:fix/frontend-heading-hierarchy
