name: Build news content width assets

on:
  push:
    branches:
      - fix-news-content-width

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-news-content-width

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove news width limits
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'public/assets/css/gov-theme.css';
          let css = fs.readFileSync(file, 'utf8');

          const replacements = [
            [
              `.newsdetail:not(.newsdetail--premium) .newsdetail__title {\n    max-width: 17ch;`,
              `.newsdetail:not(.newsdetail--premium) .newsdetail__title {\n    width: 100%;\n    max-width: none;`
            ],
            [
              `.newsdetail:not(.newsdetail--premium) .newsdetail-article__content {\n    max-width: 76ch;`,
              `.newsdetail:not(.newsdetail--premium) .newsdetail-article__content {\n    width: 100%;\n    max-width: none;`
            ]
          ];

          for (const [before, after] of replacements) {
            if (!css.includes(before)) {
              throw new Error(`Expected CSS fragment was not found: ${before}`);
            }
            css = css.replace(before, after);
          }

          fs.writeFileSync(file, css);
          NODE

      - name: Rebuild generated assets
        run: npm run build:assets

      - name: Commit generated files
        run: |
          rm .github/workflows/build-news-content-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/css/gov-theme.css public/assets/css/public.min.css public/assets/asset-manifest.json .github/workflows/build-news-content-width.yml
          git commit -m "Remove news content width limits"
          git push origin HEAD:fix-news-content-width
