name: Temporary migrate news index to feature-card interaction

on:
  push:
    branches:
      - refactor/news-index-feature-card

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[asset-rebuild]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply feature-card interaction to news index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('app/Controllers/Site/NewsController.php')
          source = controller.read_text()
          old = "        // Список новостей строится на карточках .relnews-card, а они лежат в\n        // вынесенной части темы вместе со стилями детальной новости.\n        \\App\\Core\\AssetCollector::requireThemePart('news_detail');"
          new = "        // Лента использует тот же feature-card interaction, что новости на\n        // главной: общие рамка, акцентный край, hover и spotlight. Регистрация\n        // news_feature заодно подключает стили .relnews-card, нужные контенту.\n        \\App\\Core\\AssetCollector::requireJs('news_feature');"
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one news index asset registration block')
          controller.write_text(source.replace(old, new, 1))

          css_path = Path('public/assets/css/blocks/news-feature.css')
          css = css_path.read_text()
          needle = "    .block-newsfeat--mosaic .newsfeat-text"
          replacement = "    .block-newsfeat--mosaic .newsfeat-text,\n    .newslist-lead,\n    .newslist-grid .relnews-card"
          count = css.count(needle)
          if count != 7:
              raise SystemExit(f'Expected 7 shared feature-card selector groups, got {count}')
          css_path.write_text(css.replace(needle, replacement))

          js_path = Path('public/assets/js/blocks/news_feature.js')
          js = js_path.read_text()
          old_js = "    var selector = '.block-newsfeat--mosaic .newsfeat-lead, '\n        + '.block-newsfeat--mosaic .newsfeat-mini, '\n        + '.block-newsfeat--mosaic .newsfeat-text';"
          new_js = "    var selector = '.block-newsfeat--mosaic .newsfeat-lead, '\n        + '.block-newsfeat--mosaic .newsfeat-mini, '\n        + '.block-newsfeat--mosaic .newsfeat-text, '\n        + '.newslist-lead, .newslist-grid .relnews-card';"
          if js.count(old_js) != 1:
              raise SystemExit('Expected exactly one news feature spotlight selector')
          js_path.write_text(js.replace(old_js, new_js, 1))
          PY
      - name: Install JavaScript tooling
        run: npm ci
      - name: Rebuild production assets
        run: npm run build:assets
      - name: Commit generated assets and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-news-index-feature-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Controllers/Site/NewsController.php public/assets/css/blocks/news-feature.css public/assets/css/blocks/news-feature.min.css public/assets/js/blocks/news_feature.js public/assets/js/blocks/news_feature.min.js public/assets/asset-manifest.json .github/workflows/tmp-news-index-feature-card.yml
          git commit -m "refactor(news): use feature-card interaction in listing [asset-rebuild]"
          git push
