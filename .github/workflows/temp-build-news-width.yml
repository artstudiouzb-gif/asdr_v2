name: Temporary news width asset build

on:
  push:
    branches:
      - fix-news-page-v2
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply news content width update
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'public/assets/css/gov-theme.css';
          let css = fs.readFileSync(file, 'utf8');

          const replacements = [
            [
              `.newsdetail:not(.newsdetail--premium) .newsdetail__title {\n    max-width: 17ch;`,
              `.newsdetail:not(.newsdetail--premium) .newsdetail__title {\n    width: 100%;\n    max-width: 24ch;`
            ],
            [
              `.newsdetail:not(.newsdetail--premium) .newsdetail__lead {\n    max-width: 66ch;`,
              `.newsdetail:not(.newsdetail--premium) .newsdetail__lead {\n    max-width: 80ch;`
            ],
            [
              `.newsdetail:not(.newsdetail--premium) .newsdetail-article__content {\n    max-width: 76ch;`,
              `.newsdetail:not(.newsdetail--premium) .newsdetail-article__content {\n    width: 100%;\n    max-width: 90ch;`
            ]
          ];

          for (const [before, after] of replacements) {
            if (!css.includes(before)) {
              throw new Error(`Expected CSS fragment was not found: ${before}`);
            }
            css = css.replace(before, after);
          }

          fs.writeFileSync(file, css);
          NODE

      - name: Build assets
        run: npm run build:assets

      - name: Upload generated files
        uses: actions/upload-artifact@v7
        with:
          name: news-width-generated-assets
          path: |
            public/assets/css/gov-theme.css
            public/assets/css/public.min.css
            public/assets/asset-manifest.json
