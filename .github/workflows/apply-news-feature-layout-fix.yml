name: Apply news feature layout fix

on:
  push:
    branches:
      - fix/demo-starter-home-seeding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/demo-starter-home-seeding

      - name: Apply CSS fix
        run: python .github/apply_news_feature_layout_fix.py

      - name: Commit CSS fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/css/public-visual-system-v3.css .github/apply_news_feature_layout_fix.py .github/workflows/apply-news-feature-layout-fix.yml
          git commit -m "Fix news feature sidebar layout"
          git push origin HEAD:fix/demo-starter-home-seeding
