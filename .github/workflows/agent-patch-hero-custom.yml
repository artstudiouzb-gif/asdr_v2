name: Agent one-shot Hero patch

on:
  push:
    branches:
      - agent/hero-custom-art-size

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hero-custom-art-size
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Apply patch
        run: php scripts/agent_patch_hero_custom_v2.php
      - name: Commit patch result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(hero): finish custom media sizing and localized links"
          git push origin HEAD:agent/hero-custom-art-size
