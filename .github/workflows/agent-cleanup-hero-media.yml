name: Agent one-shot Hero media cleanup

on:
  push:
    branches:
      - agent/hero-custom-art-size

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hero-custom-art-size
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Apply cleanup
        run: php scripts/agent_cleanup_hero_media.php
      - name: Rebuild generated assets
        run: |
          npm ci
          npm run build:assets
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(hero): remove legacy media sizing conflicts"
          git push origin HEAD:agent/hero-custom-art-size
