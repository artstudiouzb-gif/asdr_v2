name: Temporary rebuild card lift assets

on:
  push:
    branches:
      - feat/card-hover-lift-setting

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[asset-rebuild]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/card-hover-lift-setting
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild production assets
        run: npm run build:assets
      - name: Commit generated assets and remove temporary workflow
        run: |
          rm .github/workflows/tmp-rebuild-card-lift-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "Rebuild production assets [asset-rebuild]"
          git push origin HEAD:feat/card-hover-lift-setting
