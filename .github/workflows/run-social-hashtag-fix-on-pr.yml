name: Apply social hashtag formatting fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix-social-hashtag-formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-social-hashtag-formatting

      - name: Execute robust patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/apply-social-hashtag-fix-v2.yml').read_text(encoding='utf-8')
          marker = "      - name: Apply robust patch\n        run: |\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n      - name: Validate changed PHP files", start)
          script = textwrap.dedent(workflow[start:end])
          subprocess.run(['bash', '-lc', script], check=True)
          PY

      - name: Validate changed PHP files
        run: |
          php -l app/Models/News.php
          php -l app/Core/SocialSettings.php
          php -l app/Core/SocialPublisher.php
          php -l app/Core/TelegramRichMessage.php
          php -l tests/cases/108_news_hashtags_test.php
          php -l tests/cases/205_telegram_rich_test.php

      - name: Commit changes
        run: |
          rm -f .github/workflows/build-social-hashtag-fix.yml
          rm -f .github/workflows/run-social-hashtag-fix-on-pr.yml
          rm -f .github/workflows/apply-social-hashtag-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix hashtag formatting in site and social posts"
          git push origin HEAD:fix-social-hashtag-formatting
