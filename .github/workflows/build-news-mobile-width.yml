name: Build news mobile width assets

on:
  push:
    branches:
      - fix-news-content-width

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-news-content-width

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Improve lead and mobile widths
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'public/assets/css/gov-theme.css';
          let css = fs.readFileSync(file, 'utf8');

          const leadBefore = `.newsdetail:not(.newsdetail--premium) .newsdetail__lead {\n    max-width: 66ch;`;
          const leadAfter = `.newsdetail:not(.newsdetail--premium) .newsdetail__lead {\n    width: 100%;\n    max-width: none;`;
          if (!css.includes(leadBefore)) {
            throw new Error('Expected lead width rule was not found');
          }
          css = css.replace(leadBefore, leadAfter);

          const tabletAnchor = `    .newsdetail:not(.newsdetail--premium) .newsdetail-article__content { max-width: none; }\n}`;
          const tabletReplacement = `    .newsdetail:not(.newsdetail--premium) .newsdetail-article__content { max-width: none; }\n    .newsdetail:not(.newsdetail--premium),\n    .newsdetail:not(.newsdetail--premium) > .newsdetail-head,\n    .newsdetail:not(.newsdetail--premium) > .newsdetail-body,\n    .newsdetail:not(.newsdetail--premium) .newsdetail-article,\n    .newsdetail:not(.newsdetail--premium) .newsdetail-head__info,\n    .newsdetail:not(.newsdetail--premium) .newsdetail__lead,\n    .newsdetail:not(.newsdetail--premium) .newsdetail-article__content {\n        width: 100%;\n        min-width: 0;\n        max-width: none;\n    }\n    .newsdetail:not(.newsdetail--premium) .newsdetail-side--right > * {\n        width: 100%;\n        min-width: 0;\n        max-width: none;\n        align-self: stretch;\n    }\n}`;
          if (!css.includes(tabletAnchor)) {
            throw new Error('Expected tablet news layout anchor was not found');
          }
          css = css.replace(tabletAnchor, tabletReplacement);

          const mobileAnchor = `    .newsdetail:not(.newsdetail--premium) .newsdetail__lead { font-size: 1rem; }`;
          const mobileReplacement = `    .newsdetail:not(.newsdetail--premium) .newsdetail__lead {\n        width: 100%;\n        max-width: none;\n        font-size: 1rem;\n    }\n    .newsdetail:not(.newsdetail--premium) .newsdetail-card,\n    .newsdetail:not(.newsdetail--premium) .newsdetail-documents,\n    .newsdetail:not(.newsdetail--premium) .newsdetail-subscribe {\n        width: 100%;\n        min-width: 0;\n        max-width: none;\n    }\n    .newsdetail:not(.newsdetail--premium) .newsdetail-doc,\n    .newsdetail:not(.newsdetail--premium) .newsdetail-subscribe__row,\n    .newsdetail:not(.newsdetail--premium) .newsdetail-subscribe__row input {\n        min-width: 0;\n        max-width: 100%;\n    }`;
          if (!css.includes(mobileAnchor)) {
            throw new Error('Expected mobile lead rule was not found');
          }
          css = css.replace(mobileAnchor, mobileReplacement);

          fs.writeFileSync(file, css);
          NODE

      - name: Rebuild generated assets
        run: npm run build:assets

      - name: Commit generated files
        run: |
          rm .github/workflows/build-news-mobile-width.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/css/gov-theme.css public/assets/css/public.min.css public/assets/asset-manifest.json .github/workflows/build-news-mobile-width.yml
          git commit -m "Improve news lead and mobile widths"
          git push origin HEAD:fix-news-content-width
