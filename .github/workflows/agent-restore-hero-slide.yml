name: Agent restore focused HeroSlideData

on:
  push:
    branches:
      - agent/hero-custom-art-size

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/hero-custom-art-size
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Restore main file and apply focused changes
        run: |
          git show origin/main:app/Core/Hero/HeroSlideData.php > app/Core/Hero/HeroSlideData.php
          php scripts/agent_restore_hero_slide_comments.php
      - name: Commit focused file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(hero): keep HeroSlideData patch focused"
          git push origin HEAD:agent/hero-custom-art-size
