name: Temporary rebuild standard news divider assets

on:
  push:
    branches:
      - fix/standard-news-widget-divider

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[asset-rebuild]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply standard news divider fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('public/assets/css/blocks/news-detail.css')
          source = path.read_text()
          old = '''.newsdetail:not(.newsdetail--premium) .newsdetail-side--right {
              position: static;
              display: flex;
              flex-direction: column;
              gap: 16px;
              padding: 0;
              border: 0;
          }'''
          new = '''.newsdetail:not(.newsdetail--premium) .newsdetail-side--right {
              position: static;
              display: flex;
              flex-direction: column;
              gap: 16px;
          }'''
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one standard sidebar reset block')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Install JavaScript tooling
        run: npm ci
      - name: Rebuild production assets
        run: npm run build:assets
      - name: Commit generated assets and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-standard-news-divider-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/css/blocks/news-detail.css public/assets/css/blocks/news-detail.min.css public/assets/asset-manifest.json .github/workflows/tmp-standard-news-divider-assets.yml
          git commit -m "fix(news): restore standard sidebar divider [asset-rebuild]"
          git push
