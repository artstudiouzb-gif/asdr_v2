name: Fix hashtag test expectations

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix-social-hashtag-formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-social-hashtag-formatting

      - name: Update old hashtag expectations
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'tests/cases/102_layout_changes_test.php': [
                  ("assert_same('#культура #ташкент #события', $news['hashtags']);",
                   "assert_same('#Культура #Ташкент #События', $news['hashtags']);"),
              ],
              'tests/cases/215_social_preview_test.php': [
                  ("assert_contains('#islohot', $tags);", "assert_contains('#Islohot', $tags);"),
                  ("assert_contains('#реформы', $tags);", "assert_contains('#Реформы', $tags);"),
                  ("// (cleanHashtags приводит теги к нижнему регистру ещё до сборки).",
                   "// (cleanHashtags нормализует регистр ещё до сборки)."),
              ],
              'tests/cases/99_social_bilingual_test.php': [
                  ("assert_contains('#реформы #экономика', $text);",
                   "assert_contains('#Реформы #Экономика', $text);"),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate PHP syntax
        run: |
          php -l tests/cases/102_layout_changes_test.php
          php -l tests/cases/215_social_preview_test.php
          php -l tests/cases/99_social_bilingual_test.php

      - name: Commit fixes
        run: |
          rm .github/workflows/fix-hashtag-test-expectations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/cases/102_layout_changes_test.php tests/cases/215_social_preview_test.php tests/cases/99_social_bilingual_test.php .github/workflows/fix-hashtag-test-expectations.yml
          git commit -m "Update hashtag capitalization test expectations"
          git push origin HEAD:fix-social-hashtag-formatting
