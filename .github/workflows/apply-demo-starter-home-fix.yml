name: Apply demo starter home fix

on:
  push:
    branches:
      - fix/demo-starter-home-seeding

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/demo-starter-home-seeding

      - name: Patch semantic JSON comparison and regression test
        run: python .github/scripts/apply_demo_starter_home_fix.py

      - name: Commit fix to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix starter home detection for MySQL JSON"
          git push origin HEAD:fix/demo-starter-home-seeding
